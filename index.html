fltRows=function(skip){const rs=_fltRowsDec(skip);return S.flt.dec?rs.filter(GH.hasDec):rs};
const _vListDec=vList;
vList=function(){const h=_vListDec();const n=S.returns.filter(GH.hasDec).length;if(!n&&!S.flt.dec)return h;
  const bar='<div class="dec-bar"><span><b>'+n+' client decision'+(n===1?'':'s')+'</b> waiting for the team</span><button class="btn" data-act="decFlt">'+(S.flt.dec?'Show all returns':'Show them')+'</button></div>';
  return h.replace('<div id="storeBox"></div>',bar+'<div id="storeBox"></div>')};
Object.assign(ACT,{decFlt:()=>{S.flt.dec=!S.flt.dec;render()}});

GH.corTidy=()=>{if(S.tab!=='new'||!S.draft)return;const on=GH.isCor(S.draft.clientId),o=$('#f-order'),j=$('#f-job');
  const of=o&&o.closest('.fld');if(of)of.style.display=on?'none':'';
  const jl=j&&j.closest('.fld')&&j.closest('.fld').querySelector('span');if(jl)jl.textContent=on?'Reference / order number':'Reference number'};
const _renderCor=render;render=function(){_renderCor.apply(this,arguments);try{GH.corTidy()}catch(e){}};
</script>
<script>
/* ---- Thu 22 Oct 2026, evening fixes ---- */
/* Australia Post: keep only the AP Article Id (e.g. 34LNY000041601000650801) when a scan carries extra digits */
GH.apTrim=v=>{v=String(v||'').trim();const u=v.toUpperCase().replace(/\s+/g,''),m=/\d{2}[A-Z]{3}\d{18}/.exec(u);return m&&u.length>m[0].length?m[0]:v};

/* Lilly Pilly: their return form's reason codes first, numbered as on the form */
GH.LP_REASONS=['Multiple sizes purchased','Too big','Too small','Colour looks different from the website images',"Don't like the fit",'Changed my mind','Faulty item'];
GH.isLP=cid=>{const c=S.clients.find(x=>x.id===cid);return!!(c&&/lilly\s*-?\s*pilly/i.test(c.name||''))};
GH.reasonOpts=(cid,cur)=>{
  const o=(v,t)=>'<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(t)+'</option>';
  if(!GH.isLP(cid))return o('','Choose…')+REASONS.map(r=>o(r,r)).join('')+(cur&&!REASONS.includes(cur)?o(cur,cur):'');
  const lp=GH.LP_REASONS.map((r,i)=>(i+1)+'. '+r);
  return o('','Choose…')+'<optgroup label="Lilly Pilly return form">'+lp.map(r=>o(r,r)).join('')+'</optgroup>'
    +'<optgroup label="Other reasons">'+REASONS.filter(r=>!/change of mind|faulty/i.test(r)).map(r=>o(r,r)).join('')+'</optgroup>'
    +(cur&&!lp.includes(cur)&&!REASONS.includes(cur)?o(cur,cur):'')};

/* Time spent on a return: counts while staff are working in the form; gaps over 5 minutes are not counted */
GH.TM={d:null,ms:0,last:0};
GH.tmTick=()=>{if(S.tab!=='new'||!S.draft)return;const now=Date.now(),t=GH.TM;
  if(t.d!==S.draft){t.d=S.draft;t.ms=0;t.last=now;return}
  const gap=now-t.last;if(gap>0&&gap<=300000)t.ms+=gap;t.last=now};
['pointerdown','keydown','input','change','scroll'].forEach(ev=>document.addEventListener(ev,GH.tmTick,{capture:true,passive:true}));
GH.tmSec=()=>{GH.tmTick();return GH.TM.d===S.draft?GH.TM.ms/1000:0};
GH.tmReset=()=>{GH.TM={d:null,ms:0,last:0}};
GH.fmtT=sec=>{sec=Math.round(+sec||0);if(sec<60)return sec+' s';const m=Math.floor(sec/60),s=sec%60;if(m<60)return m+' min'+(s?' '+s+' s':'');const h=Math.floor(m/60);return h+' h '+(m%60)+' min'};
GH.avgT=rs=>{const t=(rs||[]).filter(r=>+r.timeSec>0);if(!t.length)return'';return'<div class="tile" style="grid-column:1/-1"><span class="lab">Avg time per return</span><b style="white-space:nowrap">'+GH.fmtT(t.reduce((a,r)=>a+(+r.timeSec),0)/t.length)+'</b></div>'};

/* Quarantine colours (amber), and 6 status cards on wide screens */
document.head.insertAdjacentHTML('beforeend','<style id="quar-st">html:not([data-theme=light]) .st-quar{color:#7FA0FF!important}.st-quar{color:#1748E8!important}.pill.st-quar .dot,.dot.st-quar{background:#1748E8!important}html[data-theme=light] i.stg-quar{background:#9A9DA4!important;box-shadow:none!important}.stg-quar{--c:#1748E8}.shell .stgs .stg.stg-quar{border-color:#1748E8!important}html[data-theme=light] .shell .stgs .stg.stg-quar{border-color:#6284F2!important}@media (min-width:900px){.shell .stgs,.stgs{grid-template-columns:repeat(3,minmax(0,1fr))!important}}@media (min-width:1280px){.shell .stgs,.stgs{grid-template-columns:repeat(5,minmax(0,1fr))!important}}</style>');

</script>
<script>
/* ---- Waiting parcels & storage report (Reports page). Thu 22 Oct 2026 ---- */
S.bill=S.bill||{free:14,rate:0.5,per:'day'};
GH.billCharge=days=>{const b=S.bill,over=Math.max(0,days-b.free);return b.per==='week'?Math.ceil(over/7)*b.rate:over*b.rate};
GH.money=n=>'A$'+(Math.round(n*100)/100).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
GH.waitData=()=>{
  const cid=S.rep&&S.rep.client;
  const rs=S.returns.filter(r=>!r.example&&r.status==='open'&&(!cid||r.clientId===cid)).map(r=>{const d=age(r.dateReceived);return{r,d,type:isRts(r)?'RTS waiting (quarantine)':'Quarantine',fee:GH.billCharge(d)}}).sort((a,b)=>b.d-a.d);
  const by={};rs.forEach(x=>{const k=x.r.clientId||'';const o=by[k]=by[k]||{name:clientName(k)||'No tenant',n:0,over:0,old:0,fee:0};o.n++;if(x.d>S.bill.free)o.over++;o.old=Math.max(o.old,x.d);o.fee+=x.fee});
  const clients=Object.values(by).sort((a,b)=>b.old-a.old);
  return{rs,clients,over:rs.filter(x=>x.d>S.bill.free).length,old:rs.length?rs[0].d:0,fee:rs.reduce((a,x)=>a+x.fee,0)};
};
GH.drawWait=()=>{
  const el=document.getElementById('waitRep');if(!el)return;
  if(!GH.billSub&&S.db){GH.billSub=1;try{S.db.doc('orgs/billing').onSnapshot(s=>{const d=s.exists?s.data():{};S.bill={free:d.free!=null?+d.free:14,rate:d.rate!=null?+d.rate:0.5,per:d.per==='week'?'week':'day'};if(S.tab==='report')GH.drawWait()},()=>{})}catch(e){}}
  const w=GH.waitData(),b=S.bill,c=S.clients.find(x=>x.id===(S.rep&&S.rep.client));
  let h='<div class="panel"><h3>Waiting parcels and storage, as of today'+(c?' · '+esc(c.name):'')+'</h3>'
   +'<p class="note">Parcels still waiting (Open, Quarantine or RTS), however long ago they arrived. The date range above does not apply here.</p>'
   +'<div class="grid"><label class="fld"><span>Free days</span><input id="bl-free" type="number" min="0" max="365" inputmode="numeric" value="'+b.free+'"></label>'
   +'<label class="fld"><span>Storage rate per parcel (A$, ex GST)</span><input id="bl-rate" type="number" min="0" step="0.05" inputmode="decimal" value="'+b.rate+'"></label>'
   +'<label class="fld"><span>Charged</span><select id="bl-per">'+opts([['day','per day'],['week','per week']],b.per)+'</select></label></div>'
   +'<div class="row"><button class="btn" data-act="billSave">Save rate</button><span class="note">Example rate; set your own. The charge starts after the free days.</span></div>'
   +'<div class="tiles"><div class="tile"><span class="lab">Parcels waiting</span><b>'+w.rs.length+'</b></div>'
   +'<div class="tile"><span class="lab">Over '+b.free+' days</span><b>'+w.over+'</b></div>'
   +'<div class="tile"><span class="lab">Longest wait</span><b>'+w.old+' d</b></div>'
   +'<div class="tile"><span class="lab">Storage if charged</span><b>'+GH.money(w.fee)+'</b></div></div>';
  if(!w.rs.length){el.innerHTML=h+'<p class="note">Nothing is waiting right now.</p></div>';return}
  h+='<div class="row">'+(S.dl?'<button class="btn pri big" data-act="waitXlsx">Download waiting parcels (Excel)</button>':'')+'</div></div>';
  h+='<div class="panel"><h3>By tenant</h3><div class="tbl"><table><thead><tr><th>Tenant</th><th>Waiting</th><th>Over '+b.free+' days</th><th>Longest (days)</th><th>Storage if charged</th></tr></thead><tbody>'
   +w.clients.map(o=>'<tr><td>'+esc(o.name)+'</td><td>'+o.n+'</td><td>'+(o.over?'<b style="color:#E5484D">'+o.over+'</b>':'0')+'</td><td>'+o.old+'</td><td>'+GH.money(o.fee)+'</td></tr>').join('')+'</tbody></table></div></div>';
  h+='<div class="panel"><h3>Longest waiting</h3><div class="tbl"><table><thead><tr><th>Reference</th><th>Tenant</th><th>Status</th><th>Location</th><th>Received</th><th>Days</th><th>Storage if charged</th></tr></thead><tbody>'
   +w.rs.slice(0,50).map(x=>'<tr><td class="mono">'+esc(x.r.jobNo||'—')+'</td><td>'+esc(clientName(x.r.clientId))+'</td><td>'+x.type+'</td><td class="mono">'+esc(x.r.location||'—')+'</td><td>'+fmtD(x.r.dateReceived)+'</td><td>'+(x.d>b.free?'<b style="color:#E5484D">'+x.d+'</b>':x.d)+'</td><td>'+GH.money(x.fee)+'</td></tr>').join('')
   +'</tbody></table></div>'+(w.rs.length>50?'<p class="note">Showing the 50 longest of '+w.rs.length+'. The Excel has all of them.</p>':'')+'</div>';
  el.innerHTML=h;
};
Object.assign(ACT,{
  billSave:async()=>{const f=Math.max(0,Math.min(365,parseInt($('#bl-free').value,10)||0)),r=Math.max(0,parseFloat($('#bl-rate').value)||0),p=$('#bl-per').value==='week'?'week':'day';
    S.bill={free:f,rate:r,per:p};GH.drawWait();try{await S.db.doc('orgs/billing').set({free:f,rate:r,per:p});toast('Storage rate saved.')}catch(e){toast('Shown with the new rate, but it could not be saved.')}},
  waitXlsx:async()=>{const w=GH.waitData(),b=S.bill;if(!w.rs.length)return toast('Nothing is waiting.');
    try{await loadXlsx()}catch(e){return toast('The Excel builder did not load. Check the connection and try again.')}
    const wb=XLSX.utils.book_new(),note='Storage: '+GH.money(b.rate)+' per parcel per '+b.per+' after '+b.free+' free days (ex GST)';
    const s1=XLSX.utils.aoa_to_sheet([['Tenant','Waiting','Over '+b.free+' days','Longest (days)','Storage if charged (A$)']].concat(w.clients.map(o=>[o.name,o.n,o.over,o.old,Math.round(o.fee*100)/100])).concat([[],[note]]));s1['!cols']=[24,10,14,14,22].map(x=>({wch:x}));
    const s2=XLSX.utils.aoa_to_sheet([['Reference','Tenant','Status','Location','Received','Days waiting','Storage if charged (A$)']].concat(w.rs.map(x=>[x.r.jobNo||'',clientName(x.r.clientId),x.type,x.r.location||'',fmtD(x.r.dateReceived),x.d,Math.round(x.fee*100)/100])));s2['!cols']=[20,22,14,10,12,13,22].map(x=>({wch:x}));
    XLSX.utils.book_append_sheet(wb,s1,'By tenant');XLSX.utils.book_append_sheet(wb,s2,'Waiting parcels');
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveFile('waiting-parcels-'+ymd(new Date())+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='bl-per'){S.bill.per=e.target.value==='week'?'week':'day';GH.drawWait()}});
const _vRepW=vReport;vReport=function(){return _vRepW.apply(this,arguments)+'<div id="waitRep"></div>'};
const _dRepW=drawReport;drawReport=function(){_dRepW.apply(this,arguments);try{GH.drawWait()}catch(e){console.error(e)}};

</script>
<script>
/* ---- Time per tenant (internal), Reports page. Fri 23 Oct 2026 ----
   Uses the automatic timer on each return (timeSec). Staff app only: never in the client portal or client Excel. */
GH.timeData=()=>{const r=S.rep;
  const rs=S.returns.filter(x=>!x.example&&+x.timeSec>0&&match(x,{client:r.client,from:r.from,to:r.to}));
  const by={};rs.forEach(x=>{const k=x.clientId||'';const o=by[k]=by[k]||{name:clientName(k)||'No tenant',n:0,sec:0,max:0,units:0};o.n++;o.sec+=+x.timeSec;o.max=Math.max(o.max,+x.timeSec);o.units+=goodQ(x)+badQ(x)});
  const list=Object.values(by).sort((a,b)=>b.sec-a.sec);const tot=rs.reduce((a,x)=>a+(+x.timeSec),0);
  const all=S.returns.filter(x=>!x.example&&match(x,{client:r.client,from:r.from,to:r.to})).length;
  return{rs,list,tot,all}};
GH.mins=s=>Math.round((+s||0)/6)/10;
GH.drawTime=()=>{const el=document.getElementById('timeRep');if(!el)return;const t=GH.timeData(),r=S.rep;
  let h='<div class="panel"><h3>Time spent by tenant · internal</h3><p class="note">Staff only. Never shown to clients. Each return is timed automatically from the first entry to Save (pauses over 5 minutes are not counted). '+fmtD(r.from)+' to '+fmtD(r.to)+'.</p>';
  if(!t.rs.length){el.innerHTML=h+'<p class="note">No timed returns in this date range yet. Timing started on 22 Oct, so only returns logged from then on have a time.</p></div>';return}
  h+='<div class="tiles"><div class="tile"><span class="lab">Timed returns</span><b>'+t.rs.length+(t.all>t.rs.length?' <small style="font-size:.5em;opacity:.7">of '+t.all+'</small>':'')+'</b></div><div class="tile"><span class="lab">Total time</span><b>'+GH.fmtT(t.tot)+'</b></div><div class="tile"><span class="lab">Average per return</span><b>'+GH.fmtT(t.tot/t.rs.length)+'</b></div></div>';
  h+='<div class="tbl"><table><thead><tr><th>Tenant</th><th>Returns</th><th>Units</th><th>Total time</th><th>Average per return</th><th>Longest</th><th>Share of time</th></tr></thead><tbody>'
   +t.list.map(o=>'<tr><td>'+esc(o.name)+'</td><td>'+o.n+'</td><td>'+o.units+'</td><td>'+GH.fmtT(o.sec)+'</td><td><b>'+GH.fmtT(o.sec/o.n)+'</b></td><td>'+GH.fmtT(o.max)+'</td><td>'+Math.round(o.sec/t.tot*100)+'%</td></tr>').join('')+'</tbody></table></div>';
  h+='<div class="row">'+(S.dl?'<button class="btn" data-act="timeXlsx">Download time report (Excel, internal)</button>':'')+'</div></div>';
  el.innerHTML=h};
ACT.timeXlsx=async()=>{const t=GH.timeData(),r=S.rep;if(!t.rs.length)return toast('No timed returns in this date range.');
  try{await loadXlsx()}catch(e){return toast('The Excel builder did not load. Check the connection and try again.')}
  const wb=XLSX.utils.book_new();
  const s1=XLSX.utils.aoa_to_sheet([['Tenant','Returns','Units','Total minutes','Average minutes per return','Longest (minutes)','Share of time']].concat(t.list.map(o=>[o.name,o.n,o.units,GH.mins(o.sec),GH.mins(o.sec/o.n),GH.mins(o.max),Math.round(o.sec/t.tot*1000)/10+'%'])).concat([[],['Internal only. '+fmtD(r.from)+' to '+fmtD(r.to)+'. Timed automatically from first entry to Save; pauses over 5 minutes not counted.']]));
  s1['!cols']=[24,9,8,14,24,16,13].map(w=>({wch:w}));
  const s2=XLSX.utils.aoa_to_sheet([['Date received','Reference','Tenant','Type','Units','Minutes']].concat(t.rs.slice().sort((a,b)=>String(a.dateReceived).localeCompare(b.dateReceived)).map(x=>[fmtD(x.dateReceived),x.jobNo||'',clientName(x.clientId),isRts(x)?'RTS':'Customer return',goodQ(x)+badQ(x),GH.mins(x.timeSec)])));
  s2['!cols']=[13,20,22,16,7,9].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,s1,'By tenant');XLSX.utils.book_append_sheet(wb,s2,'Each return');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveFile('time-by-tenant-'+r.from+'-to-'+r.to+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))};
{const _vRepT=vReport;vReport=function(){return _vRepT.apply(this,arguments).replace('<div id="waitRep"></div>','<div id="timeRep"></div><div id="waitRep"></div>')}}
{const _dRepT=drawReport;drawReport=function(){_dRepT.apply(this,arguments);try{GH.drawTime()}catch(e){console.error(e)}}}

</script>
