<body>
<title>Returns Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Side rail on desktop, bottom bar on phones; one working column (max 1120px).
   Job numbers are set like shipping-label tape. Status runs as a four-stage dock flow everywhere. */
:root{
  --bg:#F1F4F4; --surface:#FFFFFF; --sunk:#E6ECEB; --ink:#122120; --muted:#56696A; --line:#D4DDDC;
  --accent:#0F6B66; --accent-ink:#FFFFFF; --ok:#1E7F4F; --warn:#0027A8; --bad:#B3261E;
  --tape:#305EF4; --tape-ink:#16130A;
  --s-received:#5B6B7C; --s-inspected:#0027A8; --s-processed:#2F5BC2; --s-closed:#1E7F4F;
  --shadow:0 1px 2px rgba(10,30,28,.06),0 10px 28px rgba(10,30,28,.10);
  --scrim:rgba(8,20,19,.48);
  --funk:"Unbounded","Arial Black",sans-serif; --block-ink:#15110A;
  --c-received:#3F6CFF; --c-inspected:#5C82FF; --c-processed:#8FA8FF; --c-closed:#4FE0A0;
  --s-waiting:#2F5BC2; --s-action:#7A4FD0; --c-waiting:#8FA8FF; --c-action:#C9A6FF;
  --display:"Unbounded","Instrument Sans",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --spring:cubic-bezier(.2,.9,.3,1.2); --out:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1312; --surface:#151E1D; --sunk:#0F1817; --ink:#E6EEEC; --muted:#90A4A2; --line:#273533;
  --accent:#3DB5AC; --accent-ink:#06201E; --ok:#5CC08B; --warn:#4A71F0; --bad:#F0857D;
  --tape:#305EF4; --tape-ink:#16130A;
  --s-received:#9AA9B8; --s-inspected:#4A71F0; --s-processed:#8CA9F5; --s-closed:#5CC08B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.62); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#151E1D; --sunk:#0F1817; --ink:#E6EEEC; --muted:#90A4A2; --line:#273533;
  --accent:#3DB5AC; --accent-ink:#06201E; --ok:#5CC08B; --warn:#4A71F0; --bad:#F0857D;
  --tape:#305EF4; --tape-ink:#16130A;
  --s-received:#9AA9B8; --s-inspected:#4A71F0; --s-processed:#8CA9F5; --s-closed:#5CC08B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.62); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
html.lock{overflow:hidden}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---- shell ---- */
.side{display:contents}
.brand{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand img{height:28px;width:auto;max-width:110px;object-fit:contain}
.brand h1{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand .org{color:var(--muted);font-size:13px;margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{position:relative;z-index:1;flex:1 1 0;min-width:0;background:none;border:0;border-radius:10px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;transition:color .2s}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.nav-ind{position:absolute;left:0;top:0;border-radius:10px;background:var(--sunk);transition:transform .38s var(--spring),width .3s var(--out),height .3s var(--out);pointer-events:none}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--tape);color:var(--tape-ink);font:600 11px/18px var(--mono);text-align:center}
.badge.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.55)}100%{transform:scale(1)}}
.wrap:focus{outline:0}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:228px minmax(0,1fr);align-items:start}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;padding:20px 12px;background:var(--surface);border-right:1px solid var(--line)}
  .brand{position:static;border:0;padding:0 8px;flex-wrap:wrap;background:none}
  .brand .org{margin-left:0;flex-basis:100%}
  .nav{position:relative;flex-direction:column;border:0;padding:0;gap:2px;background:none}
  .nav button{flex:none;flex-direction:row;gap:11px;padding:10px 12px;font-size:14.5px;justify-content:flex-start}
  .badge{position:static;margin-left:auto}
  .wrap{padding-block:28px 60px;padding-inline:32px}
}
.wrap.enter>*{animation:rise .34s var(--out) backwards}
.wrap.enter>*:nth-child(2){animation-delay:.04s}.wrap.enter>*:nth-child(3){animation-delay:.08s}.wrap.enter>*:nth-child(4){animation-delay:.12s}.wrap.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---- type and primitives ---- */
h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.015em;margin:0;line-height:1.15;text-wrap:balance}
h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>*{min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:13px;margin:0}
.banner{background:color-mix(in srgb,var(--tape) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--tape) 55%,var(--line));border-radius:10px;padding:10px 14px;font-size:14px}
.job{font-family:var(--mono);font-weight:500;background:var(--tape);color:var(--tape-ink);padding:2px 7px;border-radius:3px;font-size:13px;white-space:nowrap;display:inline-block}
.job.big{font-size:15px;padding:4px 9px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 15px;min-height:44px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink);transition:transform .12s var(--out),background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.big{padding:13px 22px;font-size:16px;min-height:50px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.icb{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;cursor:pointer;color:var(--ink)}

/* ---- pattern 05: floating label fields ---- */
.fld{position:relative;display:flex;flex-direction:column;flex:none;min-width:0}
.row>.fld,.dr-pad>.fld{flex:1 1 170px}
.fld>span:first-child{position:absolute;left:13px;top:8px;z-index:1;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--muted);pointer-events:none;transform-origin:left top;transition:transform .2s var(--out);white-space:nowrap;max-width:calc(78% - 20px);overflow:hidden;text-overflow:ellipsis}
.fld:has(input[placeholder=" "]:placeholder-shown:not(:focus))>span:first-child{transform:translateY(10px) scale(1.26);font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-height:44px;transition:border-color .15s,box-shadow .15s}
.fld input,.fld select,.fld textarea{padding:25px 12px 7px;min-height:56px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:96px;resize:vertical}
.fld input[type=color]{padding:25px 10px 6px}
.with-btn{display:flex;gap:6px;align-items:stretch}
.with-btn input{flex:1;min-width:0}
.with-btn .btn{min-height:56px}
.btn.mic.rec{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:rec 1s ease-in-out infinite}
@keyframes rec{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 25%,transparent)}}
input.hit{animation:hit .9s var(--out)}
@keyframes hit{0%{background:color-mix(in srgb,var(--ok) 30%,var(--surface))}}

/* ---- pattern 04: sliding selection ---- */
.seg{position:relative;display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--sunk);border-radius:11px;padding:3px;max-width:100%}
.seg button{position:relative;z-index:1;border:0;background:none;border-radius:8px;padding:8px 13px;min-height:38px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .2s;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.seg button small{font:500 11px var(--mono);opacity:.75}
.seg-th{position:absolute;left:0;top:0;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(10,30,28,.18);opacity:0;transition:transform .36s var(--spring),width .25s var(--out),height .25s var(--out),opacity .15s;pointer-events:none}
.pick{display:flex;flex-direction:column;gap:5px;min-width:0}
.pick>span{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--muted);padding-left:2px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pill{font-size:12.5px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,currentColor 13%,transparent)}
.pill.pop{animation:pop .55s var(--spring)}
@keyframes pop{0%{transform:scale(.8);opacity:.3}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.st-open{color:var(--s-received)} .st-rts{color:var(--s-inspected)} .st-shelf{color:var(--s-closed)} .st-discarded{color:var(--bad)} .st-resent{color:var(--s-processed)}
.stg-open{background:var(--c-received)} .stg-rts{background:var(--c-inspected)} .stg-shelf{background:var(--c-closed)} .stg-discarded{background:var(--c-inspected)} .stg-resent{background:var(--c-processed)}
.rw-q{font-weight:600;color:var(--ink)}
.st-waiting{color:var(--s-waiting)} .st-action{color:var(--s-action)} .st-received{color:var(--s-received)} .st-inspected{color:var(--s-inspected)} .st-processed{color:var(--s-processed)} .st-closed{color:var(--s-closed)}
.trk{display:flex;gap:3px;width:64px;flex:none}
.trk i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.trk i.on::after{content:"";position:absolute;inset:0;background:currentColor;border-radius:3px}
.trk i.new::after{animation:fillx .5s var(--out) backwards}
@keyframes fillx{from{transform:translateX(-101%)}}

/* ---- stage board ---- */
.hero{display:flex;flex-direction:column;gap:6px}
.hero-k{margin:0;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero-h{font-family:var(--funk);font-weight:800;font-size:clamp(26px,5.4vw,56px);line-height:1.08;letter-spacing:-.035em}
.hero-h b{display:inline-block;background:var(--tape);color:var(--tape-ink);padding:.02em .24em;border-radius:.2em;rotate:-4deg;margin-right:.22em;font-variant-numeric:tabular-nums}
.hero-s{margin:0;color:var(--muted)}
.stgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;padding-block:8px 6px}
@media (min-width:900px){.stgs{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.stgs .stg:last-child:nth-child(odd){grid-column:auto}}
.stg{position:relative;text-align:left;border:2px solid var(--block-ink);border-radius:24px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:5px;cursor:pointer;color:var(--block-ink);min-width:0;box-shadow:0 7px 0 var(--block-ink);transition:rotate .35s var(--spring),translate .35s var(--spring),box-shadow .2s}
.stg:nth-child(odd){rotate:-1.4deg} .stg:nth-child(even){rotate:1.4deg}
.stg:hover,.stg:focus-visible{rotate:0deg;translate:0 -7px;box-shadow:0 14px 0 var(--block-ink)}
.stg:active{translate:0 3px;box-shadow:0 3px 0 var(--block-ink)}
.stg-waiting{background:var(--c-waiting)} .stg-action{background:var(--c-action)} .stg:last-child:nth-child(odd){grid-column:1/-1}
.stg-received{background:var(--c-received)} .stg-inspected{background:var(--c-inspected)} .stg-processed{background:var(--c-processed)} .stg-closed{background:var(--c-closed)}
.stg-n{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.stg-t{font:600 clamp(15px,1.9vw,20px)/1.15 var(--funk);letter-spacing:-.02em}
.stg b{font:800 clamp(52px,8.2vw,92px)/.95 var(--funk);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.stg-d{font-size:13px;line-height:1.3;min-height:2.6em}
.pk{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:20px;margin-top:4px}
.pk i{width:22px;height:20px;border-radius:5px;background:var(--block-ink);background-image:linear-gradient(90deg,transparent 9px,var(--c-received) 9px 13px,transparent 13px)}
.pk em{font:500 12px var(--mono);font-style:normal;margin-left:2px}
.stg-f{font:500 12px var(--mono);margin-top:8px;padding-top:8px;border-top:2px dashed color-mix(in srgb,var(--block-ink) 45%,transparent)}
.wrap.enter .stg{animation:drop .65s var(--spring) backwards;animation-delay:calc(var(--i) * 80ms + 60ms)}
@keyframes drop{from{opacity:0;translate:0 -36px;rotate:-9deg;scale:.9}}
.wrap.enter .pk i{animation:pk .45s var(--spring) backwards;animation-delay:calc(.45s + var(--j) * 45ms)}
@keyframes pk{from{opacity:0;translate:0 -16px;scale:.3}}
.mix{display:flex;gap:3px;height:16px}
.mix i{min-width:6px;border-radius:8px;border:2px solid var(--block-ink)}
/* ---- dashboard ---- */
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stage{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;overflow:hidden;transition:transform .15s var(--out),border-color .15s,box-shadow .15s}
.stage:hover{border-color:var(--muted);box-shadow:var(--shadow);transform:translateY(-2px)}
.stage:active{transform:scale(.98)}
.stage .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:7px}
.stage b{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.stage .sub{font-size:12.5px;color:var(--muted)}
.stage .go{position:absolute;right:12px;top:12px;color:var(--muted);opacity:0;transform:translateX(-4px);transition:.2s var(--out)}
.stage:hover .go,.stage:focus-visible .go{opacity:1;transform:none}
.stage.lead{grid-column:1/-1;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stage.lead b,.stage.lead .lab{color:var(--bg)} .stage.lead .sub,.stage.lead .go{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.stage.lead b{font-size:60px}
@media (min-width:760px){.flow{grid-template-columns:1.35fr repeat(4,minmax(0,1fr))}.stage.lead{grid-column:auto}}
.dgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:760px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.dp.wide{grid-column:1/-1}}
.dp-h{display:flex;align-items:center;gap:8px;min-height:32px}
.dp-h h3{flex:1;min-width:0}
.grip{width:32px;height:32px;flex:none;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center;cursor:grab;touch-action:none}
.grip:hover{background:var(--sunk);color:var(--ink)}
.grip .ic{stroke-width:2.6}
.dp.slot{border-style:dashed;background:var(--sunk)} .dp.slot>*{visibility:hidden}
.dp.ghost{transition:scale .18s var(--out),box-shadow .18s,rotate .18s}
.dp.ghost.lift{scale:1.025;rotate:.6deg;box-shadow:var(--shadow);cursor:grabbing}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 36px;gap:8px;align-items:center;font-size:13.5px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{background:var(--sunk);height:12px;border-radius:6px;overflow:hidden}
.bar .fl{display:block;background:var(--accent);height:100%;width:0;border-radius:6px;transition:width .7s var(--out)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.trend{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.trend i{flex:1;background:var(--accent);min-height:2px;height:0;border-radius:4px 4px 0 0;transition:height .7s var(--out)}
.trend i.zero{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.old{display:flex;gap:10px;align-items:center;padding:9px 6px;border:0;border-bottom:1px solid var(--line);flex-wrap:wrap;cursor:pointer;background:none;width:100%;text-align:left;border-radius:6px;transition:background .15s}
.old:hover{background:var(--sunk)}
.old:last-child{border-bottom:0}
.old .ag{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.ag.w{color:var(--warn)} .ag.b{color:var(--bad)}

/* ---- returns list: patterns 03 and 07 ---- */
.drawer{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dr-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--out)}
.drawer[data-open="true"] .dr-body{grid-template-rows:1fr}
.dr-in{overflow:hidden;min-height:0}
.dr-pad{padding:14px 14px 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dr-bar{width:100%;border:0;background:none;padding:6px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;touch-action:none;color:var(--muted);font-size:13px;font-weight:500}
.dr-bar i{width:38px;height:4px;border-radius:2px;background:var(--line);transition:background .15s,width .2s var(--out)}
.dr-bar:hover i,.drawer.drag .dr-bar i{background:var(--muted);width:52px}
.dr-bar span{display:inline-flex;align-items:center;gap:6px}
.dr-bar .ic{width:16px;height:16px;transition:transform .3s var(--out)}
.drawer[data-open="true"] .dr-bar .chev{transform:rotate(180deg)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rw{position:relative;border-radius:12px}
.rw-under{position:absolute;inset:0;background:var(--s-closed);display:flex;align-items:center;padding-left:18px;color:var(--surface);font-weight:600;border-radius:12px;opacity:0;text-transform:capitalize}
.rw-under span{display:inline-flex;align-items:center;gap:8px;transform:scale(.9);transition:transform .2s var(--spring)}
.rw.sw .rw-under{opacity:.75} .rw.armed .rw-under{opacity:1} .rw.armed .rw-under span{transform:scale(1.08)}
.rw-card{position:relative;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:border-color .15s,box-shadow .15s}
.rw-card:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.rw.fresh .rw-card{animation:fresh 1.6s var(--out)}
@keyframes fresh{0%,35%{background:color-mix(in srgb,var(--tape) 35%,var(--surface))}}
.rw-main{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:12px 6px 12px 14px;border-radius:12px;display:grid;gap:5px 12px;align-items:center;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"job pill" "cl cl" "meta meta"}
.rw-main .job{grid-area:job;justify-self:start}
.rw-main .pill{grid-area:pill;justify-self:end}
.rw-cl{grid-area:cl;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;align-items:center}
.adv{width:52px;flex:none;border:0;border-left:1px solid var(--line);background:none;border-radius:0 12px 12px 0;cursor:pointer;color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s}
.adv:hover{background:var(--sunk);color:var(--ink)}
.adv .ic{transition:transform .2s var(--spring)} .adv:hover .ic{transform:translateX(3px)}
@media (min-width:760px){
  .rw-main{grid-template-columns:150px minmax(120px,1.2fr) minmax(0,2fr) auto;grid-template-areas:"job cl meta pill";padding-block:14px}
  .rw-meta{flex-wrap:nowrap} .rw-meta>span:nth-child(1){width:84px;flex:none} .rw-meta>.mono{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .rw-meta>span:nth-child(3){width:62px;flex:none}
}

/* ---- return form: pattern 02 ---- */
.line{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.line-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line-h strong{font-family:var(--display);font-size:16px}
.hint{font-size:12.5px;color:var(--muted);min-height:1em}
.hint.ok{color:var(--ok)} .hint.new{color:var(--warn)}
.qrow{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-start}
.qty{display:inline-flex;align-items:center;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.qb{width:44px;height:44px;border:0;border-radius:9px;background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 2px rgba(10,30,28,.14);transition:transform .1s var(--out);touch-action:manipulation}
.qb:active{transform:scale(.9)}
.qty .qv{width:64px;min-height:44px;border:0;background:none;text-align:center;padding:0;font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;cursor:ew-resize;touch-action:pan-y;box-shadow:none}
.qty .qv:focus{box-shadow:none;cursor:text}
.qty.scrub{outline:2px solid var(--accent);outline-offset:1px} .qty.scrub .qv{cursor:ew-resize}
.qnote{font-size:12.5px;font-weight:600;color:var(--warn);min-height:1.2em;align-self:center}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{position:relative;width:72px;height:72px}
.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1;padding:0}
.savebar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:4;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:10px 0;display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:900px){.savebar{bottom:0}}
.fly{position:fixed;z-index:60;pointer-events:none}
.fly .job{box-shadow:var(--shadow);font-size:14px;padding:4px 9px}

.scanner{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;justify-content:flex-end}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:42%;width:min(78vw,420px);height:min(46vw,240px);translate:-50% -50%;border:3px solid #9DB4FF;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45),0 0 30px rgba(111,141,255,.6)}
.scan-ui{position:relative;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.85) 40%)}
.scan-ui p{margin:0;text-align:center;color:#fff;font-size:17px;font-weight:600}
/* ---- tables, reports, settings ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tile{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.tile .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.tile.closed .lab{color:var(--ok)} .tile.inspected .lab{color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.empty{text-align:center;padding:36px 14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;max-width:46ch;color:var(--muted)}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.sel{user-select:all;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;z-index:80;max-width:calc(100% - 32px);font-size:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
#toast.in{animation:toast .32s var(--spring)}
@keyframes toast{from{opacity:0;transform:translate(-50%,14px) scale(.96)}}
.tbtn{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:inherit;font-weight:600;border-radius:8px;padding:6px 12px;cursor:pointer;min-height:32px}
@media (min-width:900px){#toast{bottom:28px}}

/* ---- detail sheet: patterns 01 and 07 ---- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-p{position:relative;width:100%;max-width:680px;max-height:min(88%,820px);background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;outline:0;padding-bottom:env(safe-area-inset-bottom,0px);will-change:transform}
.sheet-in{display:flex;flex-direction:column;min-height:0;flex:1}
.sh-grab{display:grid;place-items:center;height:22px;touch-action:none;cursor:grab;flex:none}
.sh-grab i{width:40px;height:4px;border-radius:2px;background:var(--line)}
.sh-h{display:flex;gap:12px;align-items:flex-start;padding:2px 16px 12px;touch-action:none;flex:none}

    <div class="brand"><img id="logo" alt="" hidden><h1>Returns Bench</h1><span class="org" id="orgName"></span><button type="button" class="theme-tg" data-act="theme" aria-label="Switch between light and dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>

      <button data-tab="new"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New return</span></button>
      <button data-tab="list"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Returns</span><b class="badge" id="navBadge" hidden></b></button>

      <button data-tab="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5a2 2 0 100 4 2 2 0 000-4zM9 15a2 2 0 100 4 2 2 0 000-4z"/></svg><span>Settings</span></button>
    </nav>
  </aside>
  <main class="wrap" id="main" tabindex="-1"></main>
</div>
<style>
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;overflow:auto;background:rgba(3,6,12,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.gate-p{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;padding:28px 24px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(111,141,255,.14),rgba(33,72,242,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 30px 90px -30px #6F8DFF}
.gate-p h2{font-family:var(--funk);font-weight:800;font-size:34px;letter-spacing:-.04em}
.gate-p h2 span{background:linear-gradient(120deg,#A9BEFF,#2F57F5);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-forgot{align-self:center;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}.gate-forgot:hover{color:var(--ink)}
.gate-err{color:var(--bad);font-size:15px;min-height:1.3em;margin:0}
.gate details{font-size:15px;color:var(--muted)} .gate summary{cursor:pointer;padding:4px 0}
</style>
<div id="gate" class="gate" hidden>
  <form class="gate-p" onsubmit="return false" aria-labelledby="gate-t">
    <h2 id="gate-t">Returns <span>Bench</span></h2>
    <div id="gate-login" style="display:flex;flex-direction:column;gap:14px"><p class="note">Sign in with the email your manager invited.</p>
    <label class="fld"><span>Email</span><input id="sb-email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" "></label>
    <label class="fld"><span>Password</span><input id="sb-pass" type="password" autocomplete="current-password" placeholder=" "></label>
    <label class="fld"><span>Your initials (on every return you touch)</span><input id="sb-initials" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder=" "></label>
    <button class="btn pri big" data-act="connect" type="submit">Sign in</button>
    <button class="gate-forgot" data-act="forgotPass" type="button">Forgot password?</button></div>
    <div id="gate-pw" hidden style="display:flex;flex-direction:column;gap:14px"><p class="note" id="sb-pw-sub">Welcome. Create a password for your account. You'll use it with your email to sign in next time.</p>

  <div class="sheet-bg" data-act="closeSheet"></div>

</div>
<input type="file" id="scanInput" accept="image/*" capture="environment" hidden>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="csvInput" accept=".csv,.xlsx,.xls,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
<input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp" hidden>
<div id="toast" role="status" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const REASONS=['Faulty','Wrong item sent','Change of mind','Refused delivery','Damaged in transit','Undeliverable','Other'];
const GRADES=[['A','A · Resaleable'],['B','B · Repackage'],['C','C · Damaged']];
const DISPO=['Restock','Quarantine','Return to client','Dispose'];
const STATUS=['received','inspected','processed','closed'];
const CARRIERS=['','Australia Post','StarTrack','Aramex','CouriersPlease','DHL','TNT','Toll','Other'];
const TABS=['dash','new','list','report','settings'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const fmtD=s=>{if(!s)return'—';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const age=s=>s?Math.max(0,Math.round((new Date(today())-new Date(s))/864e5)):0;
const opts=(arr,val)=>arr.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o||'—'];return'<option value="'+esc(v)+'"'+(v===val?' selected':'')+'>'+esc(l)+'</option>'}).join('');
const units=r=>(r.lines||[]).reduce((a,l)=>a+(+l.qtyGood||0)+(+l.qtyDamaged||0),0);

const S={db:null,assets:null,dl:null,user:null,uid:null,conn:'wait',org:{name:'',color:'',logo:''},clients:[],returns:[],
  gotClients:false,gotReturns:false,sku:{},names:{},draft:null,editId:null,formLive:false,uploading:0,tab:'dash',
  period:30,dashClient:'',flt:{q:'',client:'',status:'',from:'',to:''},rep:{client:'',from:daysAgo(30),to:today()},imp:null,anim:true,target:null};

function fail(e,what){console.error(e);const c=e&&e.code;toast(c==='quota_exceeded'?'Storage is full. Delete old records or photos, then try again.':c==='invalid_argument'||c==='not_granted'?'You don\'t have permission to '+what+' on this page.':'Could not '+what+'. Check your connection and try again.')}
const clientName=id=>(S.clients.find(c=>c.id===id)||{}).name||'Unknown client';

/* ---------- boot ---------- */
async function boot(){
  S.tab='dash';
  newDraft();render();
  const use=n=>GH.use(n);
  const [db,assets,dl,user]=await Promise.all(['db','assets','downloads','user'].map(use));
  Object.assign(S,{db,assets,dl,user});
  if(user){try{S.uid=await user.id()}catch(e){}}
  S.conn=db?'ok':'none';
  if(db){
    const err=e=>{console.error(e);S.conn='lost';render()};
    db.doc('orgs/main').onSnapshot(s=>{S.org=Object.assign({name:'',color:'',logo:''},s.exists?s.data():{});applyBrand();if(S.tab==='settings')render()},err);
    db.collection('clients').onSnapshot(q=>{S.clients=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(a.name).localeCompare(b.name));S.gotClients=true;soft()},err);
    db.collection('returns').orderBy('createdAt','desc').limit(1000).onSnapshot(q=>{S.returns=q.docs.map(d=>Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data()))));S.returns.forEach(norm);S.gotReturns=true;soft()},err);
  }
  render();
}
function rgb(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function applyBrand(){
  const r=document.documentElement,c=S.org.color||'';
  if(/^#[0-9a-f]{6}$/i.test(c)){const[R,G,B]=rgb(c);r.style.setProperty('--accent',c);r.style.setProperty('--accent-ink',(R*299+G*587+B*114)/1000>150?'#131C26':'#FFFFFF')}
  else{r.style.removeProperty('--accent');r.style.removeProperty('--accent-ink')}
  $('#orgName').textContent=S.org.name||'';
  const l=$('#logo');if(S.org.logo){GH.img(l,S.org.logo);l.hidden=false}else l.hidden=true;
}
function emptyState(){
  if(!S.gotReturns)return'<div class="panel empty"><p>Loading returns…</p></div>';
  return'<div class="panel empty"><h2>No returns logged yet</h2><p>Add your clients in Settings, then log the first return. Counts, ageing and trends appear here as soon as there is data.</p><div class="row" style="justify-content:center"><button class="btn pri" data-act="tab" data-v="'+(S.clients.length?'new':'settings')+'">'+(S.clients.length?'Log a return':'Add a client')+'</button><button class="btn" data-act="examples">Load example data</button></div><p class="note">Example data is labelled as a sample and can be removed in Settings.</p></div>';
}
/* ---------- return form ---------- */
function blankLine(){return{barcode:'',sku:'',name:'',qtyExp:1,qtyRecv:1,reason:'',grade:'',disposition:'',photos:[],hint:''}}
function nextJob(){const d=new Date(),base='RTN-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-';let n=S.returns.filter(r=>String(r.jobNo).startsWith(base)).length+1;while(S.returns.some(r=>r.jobNo===base+String(n).padStart(3,'0')))n++;return base+String(n).padStart(3,'0')}
function newDraft(){S.editId=null;S.draft={jobNo:'',clientId:'',orderNo:'',tracking:'',carrier:'',dateReceived:today(),dateProcessed:'',status:'received',notes:'',lines:[blankLine()]}}
async function loadSku(cid){
  if(!cid||!S.db)return{code:{},sku:{}};if(S.sku[cid])return S.sku[cid];
  const m={code:{},sku:{}};
  try{const q=await S.db.collection('clients/'+cid+'/skus').get();q.docs.forEach(d=>{const it=(d.data()||{}).items||{};for(const k in it){const v={sku:it[k][0],name:it[k][1]};if(!k.startsWith('sku:'))m.code[k]=v;if(v.sku)m.sku[v.sku.toUpperCase()]=v}});S.sku[cid]=m}catch(e){console.error(e)}
  return m;
}
async function lookup(i,by){
  const d=S.draft,l=d.lines[i];if(!l)return;
  if(!d.clientId){setHint(i,'Choose a client to match this against their SKU list.','');return}
  const m=await loadSku(d.clientId);let hit=null;
  if(by==='barcode'&&l.barcode)hit=m.code[l.barcode.trim()];
  if(by==='sku'&&l.sku)hit=m.sku[l.sku.trim().toUpperCase()];
  if(hit){l.sku=hit.sku||l.sku;l.name=hit.name||l.name;const a=$('#l'+i+'-sku'),b=$('#l'+i+'-name');if(a)a.value=l.sku;if(b)b.value=l.name;setHint(i,'Matched: '+(hit.name||hit.sku)+'. Check it is the right product.','ok')}
  else if((by==='barcode'&&l.barcode)||(by==='sku'&&l.sku))setHint(i,by==='barcode'?'Not in this client\'s SKU list. Type the SKU and name once and it will be remembered.':'SKU not in this client\'s list. Check the code.','new');
  else setHint(i,'','');
}
function setHint(i,t,c){const l=S.draft.lines[i];if(l){l.hint=t;l.hintCls=c}const e=$('#l'+i+'-hint');if(e){e.textContent=t;e.className='hint '+c}}
async function saveReturn(){
  const d=S.draft,db=S.db;if(!db)return toast('Not connected, so this can\'t be saved yet.');
  if(!d.clientId)return toast('Choose a client first.');
  if(!d.jobNo.trim())return toast('Add a job number.');
  if(S.returns.some(r=>r.jobNo===d.jobNo.trim()&&r.id!==S.editId))return toast('Job number '+d.jobNo+' is already used. Change it.');
  if(S.uploading)return toast('Photos are still uploading. Try again in a moment.');
  const now=new Date().toISOString(),prev=S.editId?S.returns.find(r=>r.id===S.editId):null,by=S.uid||'';
  const hist=((prev&&prev.history)||[]).slice(-40);
  hist.push({at:now,by,what:!prev?'Logged as '+d.status:prev.status!==d.status?'Status changed to '+d.status:'Edited'});
  const body={jobNo:d.jobNo.trim(),clientId:d.clientId,orderNo:d.orderNo.trim(),tracking:d.tracking.trim(),carrier:d.carrier,dateReceived:d.dateReceived||today(),dateProcessed:d.dateProcessed||'',status:d.status,notes:d.notes.trim(),
    lines:d.lines.filter(l=>l.barcode||l.sku||l.name||l.photos.length).map(l=>({barcode:l.barcode.trim(),sku:l.sku.trim(),name:l.name.trim(),qtyExp:+l.qtyExp||0,qtyRecv:+l.qtyRecv||0,reason:l.reason,grade:l.grade,disposition:l.disposition,photos:l.photos})),
    createdAt:(prev&&prev.createdAt)||now,createdBy:(prev&&prev.createdBy)||by,updatedAt:now,history:hist};
  if(prev&&prev.decision)body.decision=prev.decision;if(prev&&prev.example)body.example=true;if(prev&&prev.decision)body.decision=prev.decision;
  if(body.status==='closed'&&!body.dateProcessed)body.dateProcessed=today();
  const btn=$('#saveBtn');if(btn)btn.disabled=true;
  try{const ref=S.editId?db.collection('returns').doc(S.editId):db.collection('returns').doc();await ref.set(body);learn(body);afterSave(body,ref.id)}
  catch(e){if(btn)btn.disabled=false;fail(e,'save this return')}
}
async function learn(body){ // remember unknown barcodes for this client
  const m=await loadSku(body.clientId),add={};
  body.lines.forEach(l=>{if(l.barcode&&l.sku&&!m.code[l.barcode]){add[l.barcode]=[l.sku,l.name];m.code[l.barcode]={sku:l.sku,name:l.name};m.sku[l.sku.toUpperCase()]={sku:l.sku,name:l.name}}});
  if(!Object.keys(add).length)return;
  try{const ref=S.db.doc('clients/'+body.clientId+'/skus/learned'),s=await ref.get();const items=Object.assign({},s.exists?(s.data().items||{}):{},add);await ref.set({items})}catch(e){console.error(e)}
}
async function editReturn(id){
  const r=S.returns.find(x=>x.id===id);if(!r)return;
  S.editId=id;S.draft=Object.assign({orderNo:'',tracking:'',carrier:'',dateProcessed:'',notes:''},JSON.parse(JSON.stringify(r)));
  S.draft.lines=(r.lines&&r.lines.length?r.lines:[blankLine()]).map(l=>Object.assign(blankLine(),JSON.parse(JSON.stringify(l))));
  go('new');
  const ids=[...new Set((r.history||[]).map(h=>h.by).filter(x=>x&&!S.names[x]))];
  if(ids.length&&S.user&&S.user.profiles){try{const ps=await S.user.profiles(ids);ids.forEach(i=>S.names[i]=(ps[i]&&ps[i].name)||'team member');if(S.tab==='new'&&S.editId===id)render()}catch(e){}}
}

/* ---------- scanning and photos ---------- */
function fileToImg(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c)};im.src=fr.result};fr.readAsDataURL(file)})}
async function decode(file){
  const c=await fileToImg(file,1600);
  if('BarcodeDetector' in window){try{const r=await new BarcodeDetector().detect(c);if(r&&r[0])return r[0].rawValue}catch(e){}}
  if(window.ZXing){try{const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);const rd=new ZXing.BrowserMultiFormatReader(hints);const im=new Image();await new Promise((a,b)=>{im.onload=a;im.onerror=b;im.src=c.toDataURL('image/jpeg',.92)});const r=await rd.decodeFromImageElement(im);return r.getText()}catch(e){}}
  return null;
}
async function onScan(file){
  const t=S.target;if(!file||!t)return;toast('Reading barcode…');
  let code=null;try{code=await decode(file)}catch(e){}
  if(!code)return toast('No barcode found. Fill the frame with the barcode and try again, or type it in.');
  if(t.startsWith('line:')){const i=+t.slice(5);if(!S.draft.lines[i])return;S.draft.lines[i].barcode=code;const e=$('#l'+i+'-barcode');if(e){e.value=code;e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit')}toast('Scanned '+code);lookup(i,'barcode')}
  else{S.draft[t]=code;const e=$(t==='orderNo'?'#f-order':'#f-track');if(e)e.value=code;toast('Scanned '+code)}
}
async function onPhotos(files){
  const i=+S.target,l=S.draft.lines[i];if(!l||!S.assets)return;
  for(const f of files){S.uploading++;toast('Uploading photo…');
    try{const c=await fileToImg(f,1400);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));const up=await S.assets.upload(blob,{type:'image/jpeg'});l.photos.push(up.id)}
    catch(e){console.error(e);toast(e&&e.code==='quota_or_state'?'Photo storage is full.':'That photo didn\'t upload. Try again.')}
    S.uploading--}
  if(S.tab==='new')render();
}
function match(r,f){
  if(f.client&&r.clientId!==f.client)return false;if(f.status&&r.status!==f.status)return false;
  if(f.from&&r.dateReceived<f.from)return false;if(f.to&&r.dateReceived>f.to)return false;
  if(f.q){const q=f.q.toLowerCase(),hay=[r.jobNo,r.orderNo,r.tracking,r.notes].concat((r.lines||[]).flatMap(l=>[l.sku,l.barcode,l.name])).join(' ').toLowerCase();if(!hay.includes(q))return false}
  return true;
}
/* ---------- reports ---------- */
function vReport(){
  const r=S.rep;
  return'<h2>Reports</h2><div class="panel"><div class="row">'
   +'<label class="fld"><span>Tenant</span><select id="rc" data-rep="client">'+opts([['','All tenants']].concat(S.clients.map(c=>[c.id,c.name])),r.client)+'</select></label>'
   +'<label class="fld"><span>Received from</span><input id="rf" type="date" data-rep="from" value="'+esc(r.from)+'"></label>'
   +'<label class="fld"><span>Received to</span><input id="rt" type="date" data-rep="to" value="'+esc(r.to)+'"></label></div></div><div id="rep"></div>';
}
function repData(){
  const r=S.rep,rs=S.returns.filter(x=>match(x,{client:r.client,from:r.from,to:r.to})).sort((a,b)=>String(a.dateReceived).localeCompare(b.dateReceived));
  const rows=[];rs.forEach(x=>{const ls=x.lines&&x.lines.length?x.lines:[{}];ls.forEach(l=>rows.push([fmtD(x.dateReceived),x.jobNo,clientName(x.clientId),x.orderNo||'',l.sku||'',l.name||'',l.qtyExp??'',l.qtyRecv??'',l.reason||'',l.grade||'',l.disposition||'',decText(x.decision),SL(x.status)]))});
  const g=k=>rs.reduce((a,x)=>a+(x.lines||[]).filter(l=>l.grade===k).reduce((s,l)=>s+(+l.qtyRecv||0),0),0);
  const dp=k=>rs.reduce((a,x)=>a+(x.lines||[]).filter(l=>l.disposition===k).reduce((s,l)=>s+(+l.qtyRecv||0),0),0);
  return{rs,rows,units:rs.reduce((a,x)=>a+units(x),0),g:{A:g('A'),B:g('B'),C:g('C')},d:DISPO.map(k=>[k,dp(k)])};
}
const HEAD=['Received','Job','Client','Order','SKU','Product','Exp','Recv','Reason','Grade','Disposition','Tenant decision','Status'];
function summary(d){return'Returns: '+d.rs.length+'   Units received: '+d.units+'\nGrade A (resaleable): '+d.g.A+'   Grade B (repackage): '+d.g.B+'   Grade C (damaged): '+d.g.C+'\n'+d.d.map(x=>x[0]+': '+x[1]).join('   ')}
function drawReport(){
  const el=$('#rep');if(!el)return;const d=repData(),r=S.rep,c=S.clients.find(x=>x.id===r.client);
  if(!d.rs.length){el.innerHTML='<div class="panel"><p class="note">No returns were received in this date range'+(c?' for '+esc(c.name):'')+'.</p></div>';return}

function parseCsv(t){const rows=[];let row=[],v='',q=false;t=t.replace(/^﻿/,'');const d=(t.split('\n')[0].split(';').length>t.split('\n')[0].split(',').length)?';':(t.split('\n')[0].includes('\t')&&!t.split('\n')[0].includes(',')?'\t':',');
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){v+='"';i++}else q=false}else v+=c}else if(c==='"')q=true;else if(c===d){row.push(v);v=''}else if(c==='\n'){row.push(v);rows.push(row);row=[];v=''}else if(c!=='\r')v+=c}
  if(v||row.length){row.push(v);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function impItems(){const m=S.imp,g=(r,k)=>m.map[k]>=0?String(r[m.map[k]]??'').trim():'';const items={};let noCode=0,dup=0,sci=0;
  m.rows.forEach(r=>{const b=g(r,'barcode'),s=g(r,'sku'),n=g(r,'name');if(!b&&!s)return;if(/^\d(\.\d+)?E\+\d+$/i.test(b))sci++;const k=b||('sku:'+s);if(!b)noCode++;if(items[k])dup++;items[k]=[s,n]});
  return{items,noCode,dup,sci}}
function impStats(){const x=impItems();return{ok:Object.keys(x.items).length,noCode:x.noCode,dup:x.dup,sci:x.sci}}
async function onCsv(file){

}
async function impGo(){

/* ---------- pattern 04: sliding thumb that survives re-renders ---------- */
function seg(name,label,options,val){
  return'<div class="seg" role="group" aria-label="'+esc(label)+'" data-seg="'+esc(name)+'"><i class="seg-th"></i>'
   +options.map(o=>'<button type="button" data-act="seg" data-v="'+esc(o[0])+'" aria-pressed="'+(String(o[0])===String(val))+'">'+o[1]+'</button>').join('')+'</div>';
}
function placeSegs(){
  document.querySelectorAll('.seg').forEach(g=>{
    const th=g.querySelector('.seg-th'),b=g.querySelector('[aria-pressed="true"]'),k=g.dataset.seg,prev=S.segPrev[k];
    if(!b){th.style.opacity=0;delete S.segPrev[k];delete th.dataset.set;return}
    const cur={x:b.offsetLeft,y:b.offsetTop,w:b.offsetWidth,h:b.offsetHeight};
    const put=p=>{th.style.width=p.w+'px';th.style.height=p.h+'px';th.style.transform='translate('+p.x+'px,'+p.y+'px)'};
    if(!th.dataset.set){th.style.transition='none';put(prev&&!RM()?prev:cur);th.style.opacity=1;void th.offsetWidth;th.style.transition='';th.dataset.set=1}
    th.style.opacity=1;put(cur);S.segPrev[k]=cur;
  });
}
function pressSeg(b){b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b&&b.dataset.on!=='0'));placeSegs()}

function vDash(){
  const from=S.period?daysAgo(S.period-1):'';

  if(S.returns.some(r=>r.example))h+='<div class="banner">Example data. Remove it in Settings before logging real returns.</div>';
  h+=board(all,rs);

  h+='<div class="row"><label class="fld" style="max-width:320px"><span>Tenant</span><select id="dashClient" data-bind="dashClient">'+opts([['','All tenants']].concat(S.clients.map(c=>[c.id,c.name])),S.dashClient)+'</select></label></div>';
  const tally=(key)=>{const m={};rs.forEach(r=>key(r).forEach(k=>{if(k)m[k]=(m[k]||0)+1}));return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=(rows)=>{rows=rows.filter(r=>r[1]);if(!rows.length)return'<p class="note">No data in this period.</p>';const mx=Math.max(...rows.map(r=>r[1]));return'<div class="bars">'+rows.slice(0,7).map(r=>'<div class="bar"><span class="nm">'+esc(r[0])+'</span><span class="tr"><span class="fl" data-w="'+Math.round(r[1]/mx*100)+'"></span></span><span class="n">'+r[1]+'</span></div>').join('')+'</div>'};
  const old=open.slice().sort((a,b)=>String(a.dateReceived).localeCompare(b.dateReceived)).slice(0,5);
  const days=[];for(let i=13;i>=0;i--)days.push(daysAgo(i));
  const per=days.map(d=>all.filter(r=>r.dateReceived===d).length),mx=Math.max(1,...per);
  const body={
    oldest:old.length?'<div>'+old.map(r=>{const a=age(r.dateReceived);return'<button class="old" data-id="'+r.id+'" data-act="open" data-v="'+r.id+'"><span class="job">'+esc(r.jobNo)+'</span><span>'+esc(clientName(r.clientId))+'</span>'+pill(stage(r))+'<span class="ag '+(a>7?'b':a>3?'w':'')+'">'+a+' d</span></button>'}).join('')+'</div>':'<p class="note">Nothing open.</p>',
    clients:bars(tally(r=>[clientName(r.clientId)])),
    reasons:bars(tally(r=>(r.lines||[]).map(l=>l.reason))),
    grades:bars([['Good',rs.reduce((a,r)=>a+goodQ(r),0)],['Damaged',rs.reduce((a,r)=>a+badQ(r),0)]]),
    trend:'<div class="trend" role="img" aria-label="Returns per day for the last 14 days, peak '+Math.max(...per)+'">'+per.map((n,i)=>'<i class="'+(n?'':'zero')+'" data-h="'+(n?Math.max(4,Math.round(n/mx*100)):0)+'" title="'+fmtD(days[i])+': '+n+'"></i>').join('')+'</div><div class="axis"><span>'+fmtD(days[0])+'</span><span>peak '+Math.max(...per)+' in a day</span><span>'+fmtD(days[13])+'</span></div>'
  };
  const sub={trend:', 14 days'};
  h+='<div class="dgrid" id="dgrid">'+panelOrder().map(k=>'<section class="panel dp'+(k==='trend'?' wide':'')+'" data-k="'+k+'"><div class="dp-h"><h3>'+PNAME[k]+(sub[k]||'')+'</h3><button class="grip" data-grip aria-label="Move '+PNAME[k]+'. Drag, or use the arrow keys.">'+ic('grip')+'</button></div>'+body[k]+'</section>').join('')+'</div>';
  return h;

function animate(){
  const still=!S.anim||RM();S.anim=false;
  const set=()=>{document.querySelectorAll('.fl').forEach(e=>e.style.width=e.dataset.w+'%');document.querySelectorAll('.trend i').forEach(e=>e.style.height=e.dataset.h+'%')};
  if(still){document.querySelectorAll('.fl,.trend i').forEach(e=>e.style.transition='none');set();return}
  requestAnimationFrame(()=>requestAnimationFrame(set));
  document.querySelectorAll('[data-count]').forEach(el=>{const n=+el.dataset.count,t0=performance.now();if(!n)return;el.textContent='0';
    const step=t=>{const p=Math.min(1,(t-t0)/700);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1&&el.isConnected)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

/* ---------- pattern 06: drag to reorder dashboard panels ---------- */
function flip(grid,fn,skip){
  const kids=[...grid.children],a=kids.map(k=>k.getBoundingClientRect());fn();if(RM())return;
  kids.forEach((k,i)=>{if(k===skip)return;const b=k.getBoundingClientRect(),dx=a[i].left-b.left,dy=a[i].top-b.top;
    if(dx||dy)k.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'})});
}
function saveOrder(grid){S.order=[...grid.children].map(k=>k.dataset.k);try{localStorage.setItem('rd-order',JSON.stringify(S.order))}catch(e){}}
function startDrag(e,grip){
  if(e.button)return;const el=grip.closest('.dp'),grid=el.parentNode;e.preventDefault();
  const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,start=[...grid.children].map(c=>c.dataset.k);
  const ghost=el.cloneNode(true);ghost.classList.add('ghost');
  Object.assign(ghost.style,{position:'fixed',left:'0',top:'0',width:r.width+'px',height:r.height+'px',transform:'translate('+r.left+'px,'+r.top+'px)',zIndex:50,pointerEvents:'none',margin:'0'});
  document.body.appendChild(ghost);el.classList.add('slot');S.dragging=true;let lock=0,ended=false;
  requestAnimationFrame(()=>ghost.classList.add('lift'));
  const mv=ev=>{
    ghost.style.transform='translate('+(ev.clientX-ox)+'px,'+(ev.clientY-oy)+'px)';
    if(ev.clientY<70)window.scrollBy(0,-14);else if(ev.clientY>innerHeight-90)window.scrollBy(0,14);
    const now=performance.now();if(now<lock)return;
    const t=document.elementFromPoint(ev.clientX,ev.clientY),over=t&&t.closest('.dp');
    if(!over||over===el||over.parentNode!==grid)return;
    const kids=[...grid.children],before=kids.indexOf(el)>kids.indexOf(over);
    flip(grid,()=>grid.insertBefore(el,before?over:over.nextSibling),el);lock=now+280;
  };
  const end=commit=>{
    if(ended)return;ended=true;
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);window.removeEventListener('keydown',key,true);
    if(!commit)flip(grid,()=>start.forEach(k=>grid.appendChild(grid.querySelector('[data-k="'+k+'"]'))),el);
    const done=()=>{ghost.remove();el.classList.remove('slot');S.dragging=false;saveOrder(grid);if(S.dirty){S.dirty=false;render()}};
    if(RM())return done();
    const to=el.getBoundingClientRect();ghost.classList.remove('lift');
    const a=ghost.animate([{transform:ghost.style.transform},{transform:'translate('+to.left+'px,'+to.top+'px)'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});
    a.onfinish=done;a.oncancel=done;
  };
  const up=()=>end(true),cancel=()=>end(false),key=ev=>{if(ev.key==='Escape'){ev.stopPropagation();end(false)}};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel);window.addEventListener('keydown',key,true);
}
function keyMove(grip,dir){
  const el=grip.closest('.dp'),grid=el.parentNode,kids=[...grid.children],i=kids.indexOf(el),j=i+dir;if(j<0||j>=kids.length)return;
  flip(grid,()=>grid.insertBefore(el,dir<0?kids[j]:kids[j].nextSibling));saveOrder(grid);
  el.querySelector('.grip').focus();say(PNAME[el.dataset.k]+' moved to position '+(j+1)+' of '+kids.length);
}

async function saveReturn(){
  const d=S.draft,db=S.db;if(!db)return toast('Not connected, so this can\'t be saved yet.');
  if(!d.clientId)return toast('Choose a tenant first.');
  if(!d.jobNo.trim())return toast('Add the reference number.');
  if(S.returns.some(r=>r.jobNo===d.jobNo.trim()&&r.id!==S.editId))return toast('Reference number '+d.jobNo+' is already used. Change it.');
  if(S.uploading)return toast('Photos are still uploading. Try again in a moment.');
  if((d.status==='open'||d.status==='quar')&&!d.location)return toast('Choose a storage location before saving.');
  if((d.status==='open'||d.status==='quar')&&d.location&&locUsed(d.location,S.editId)>=S.store.cap)return toast('Location '+d.location+' is full. Choose another location.');
  const now=new Date().toISOString(),prev=S.editId?S.returns.find(r=>r.id===S.editId):null,by=S.uid||'';

function startScrub(e,inp){

/* ---------- pattern 08: fly-to-target on save ---------- */
function fly(from,to,label){
  return new Promise(res=>{
    if(RM()||!from||!to)return res();
    const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();if(!a.width||!b.width)return res();
    const o=document.createElement('div');o.className='fly';o.innerHTML='<span class="job">'+esc(label)+'</span>';document.body.appendChild(o);
    const x0=a.left+a.width/2,y0=a.top+a.height/2,dx=b.left+b.width/2-x0,dy=b.top+b.height/2-y0;
    o.style.left=x0+'px';o.style.top=y0+'px';
    const T=640;
    o.animate([{transform:'translate(-50%,-50%)'},{transform:'translate(-50%,-50%) translateX('+dx+'px)'}],{duration:T,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'});
    const an=o.firstChild.animate([{transform:'translateY(0) scale(.6)',opacity:0},{transform:'translateY(-34px) scale(1.25)',opacity:1,offset:.22},{transform:'translateY('+dy+'px) scale(.45)',opacity:.85}],{duration:T,easing:'cubic-bezier(.5,0,.8,.6)',fill:'forwards'});
    const done=()=>{o.remove();res()};an.onfinish=done;an.oncancel=done;setTimeout(done,T+200);
  });
}

function applyScan(t,code){
  code=String(code||'').replace(/^\][A-Za-z]\d/,'').replace(/[\x00-\x1f]+/g,' ').trim();if(!code)return;
  if(t.startsWith('line:')){const i=+t.slice(5);if(!S.draft.lines[i])return;S.draft.lines[i].barcode=code;const e=$('#l'+i+'-barcode');if(e){e.value=code;e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit')}lookup(i,'barcode')}
  else{if(t==='tracking'&&GH.apTrim)code=GH.apTrim(code);S.draft[t]=code;const e=$(t==='orderNo'?'#f-order':'#f-track');if(e){e.value=code;e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit')}}
  toast('Scanned '+code);
}
function stopScan(){
  clearInterval(SC.timer);SC.timer=null;
  if(SC.reader){try{SC.reader.reset()}catch(e){}SC.reader=null}
  if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}
  const v=$('#scanVid');if(v){try{v.pause()}catch(e){}v.srcObject=null}
  $('#scanner').hidden=true;
}
function photoScan(t){S.target=t;const i=$('#scanInput');i.value='';i.click()}
async function liveScan(t){
  SC.target=t;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!(window.ZXing||'BarcodeDetector' in window))return photoScan(t);
  const box=$('#scanner'),v=$('#scanVid'),msg=$('#scanMsg');box.hidden=false;msg.textContent='Starting the camera…';
  try{SC.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})}
  catch(e){console.error(e);msg.textContent=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'The camera is blocked for this site. Allow camera access in the browser settings, or use a photo instead.':'No camera could be started on this device. Use a photo instead.';return}
  if(box.hidden){SC.stream.getTracks().forEach(x=>x.stop());SC.stream=null;return}
  v.srcObject=SC.stream;try{await v.play()}catch(e){}
  msg.textContent='Point the camera at the barcode or QR code';
  const done=code=>{if(box.hidden)return;stopScan();if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}applyScan(t,code)};
  if('BarcodeDetector' in window){
    let det;try{det=new BarcodeDetector()}catch(e){}
    if(det){let busy=false;SC.timer=setInterval(async()=>{if(busy||v.readyState<2)return;busy=true;try{const r=await det.detect(v);if(r&&r[0])done(r[0].rawValue)}catch(e){}busy=false},200);return}
  }
  try{const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);SC.reader=new ZXing.BrowserMultiFormatReader(hints,250);
    SC.reader.decodeFromStream(SC.stream,v,(res)=>{if(res)done(res.getText())})}
  catch(e){console.error(e);msg.textContent='The scanner could not start. Use a photo instead.'}
}

    const q={ten:['tenants','legacy_id'],ret:['returns','legacy_id'],sku:['sku_docs','doc_key']}[r.t];
    let b=sb.from(q[0]).delete().eq('company_id',C()).eq(q[1],r.key);if(r.t==='sku')b=b.eq('client_key',r.cid);ok(await b);
  }
  async function readAll(path){const s=path.split('/');const out=[];
    const page=async(build,map)=>{for(let from=0;;from+=1000){const d=ok(await build().range(from,from+999));d.forEach(x=>out.push(map(x)));if(d.length<1000)break}};
    if(s[0]==='clients'&&s[2]==='skus')await page(()=>sb.from('sku_docs').select('doc_key,items').eq('company_id',C()).eq('client_key',s[1]).order('doc_key'),x=>[x.doc_key,{items:x.items}]);
    else if(s[0]==='clients')await page(()=>sb.from('tenants').select('legacy_id,settings').eq('company_id',C()).order('legacy_id'),x=>[x.legacy_id,x.settings]);
    else if(s[0]==='returns')await page(()=>sb.from('returns').select('legacy_id,extra').eq('company_id',C()).order('created_at',{ascending:false}),x=>[x.legacy_id,x.extra]);
    else throw new Error('Unknown collection '+path);
    return out}

  /* ---- live updates: re-read watched data every 20 s and whenever the tab comes back ---- */
  function refresh(){watchers.forEach(w=>w.run().catch(e=>{console.error(e)}))}
  function poll(){if(timer)return;timer=setInterval(()=>{if(!document.hidden)refresh()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()})}
  const dsnap=(id,v)=>({exists:v!=null,id,data:()=>clone(v)});

  function doc(path){const r=route(path);
    return{id:r.key,
      get:async()=>dsnap(r.key,await readDoc(r)),
      set:async d=>{await writeDoc(r,clone(d));refresh()},
      update:async d=>{const cur=(await readDoc(r))||{};await writeDoc(r,Object.assign(cur,clone(d)));refresh()},
      delete:async()=>{await deleteDoc(r);refresh()},
      onSnapshot:(cb,err)=>{let last;const w={run:async()=>{const v=await readDoc(r),j=JSON.stringify(v);if(j!==last){last=j;cb(dsnap(r.key,v))}}};watchers.push(w);w.run().catch(e=>{console.error(e);if(err)err(e)});poll()}};
  }
  function collection(path){let ord=null,lim=0;
    const snap=rows=>{let d=rows.map(([k,v])=>dsnap(k,v));if(ord)d.sort((a,b)=>{const x=String(a.data()[ord.k]||''),y=String(b.data()[ord.k]||'');return ord.desc?y.localeCompare(x):x.localeCompare(y)});if(lim)d=d.slice(0,lim);return{docs:d}};
    const o={get:async()=>snap(await readAll(path)),doc:id=>doc(path+'/'+(id||newId())),add:async d=>{const r=doc(path+'/'+newId());await r.set(d);return r},
      orderBy:(k,dir)=>{ord={k,desc:dir==='desc'};return o},limit:n=>{lim=n;return o},
      onSnapshot:(cb,err)=>{let last;const w={run:async()=>{const rows=await readAll(path),j=JSON.stringify(rows);if(j!==last){last=j;cb(snap(rows))}}};watchers.push(w);w.run().catch(e=>{console.error(e);if(err)err(e)});poll()}};
    return o;
  }

  async function blobUrl(id){

  const user={id:async()=>me.initials,profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{name:i}]))};

  async function loadMe(){

/* One-off copy from the GitHub data repository into Supabase. Admin only.
   Uses the GitHub key already saved on this device by the old version (same website), or one typed in. */
GH.importPanel=()=>GH.me().role!=='admin'?'':'<div style="margin-top:16px"><h3>Copy data from the GitHub version</h3><p class="note">Copies the company settings, tenants, SKU lists, returns and photos from the private GitHub repository. Safe to run again: it updates records instead of doubling them.</p><label class="fld"><span>GitHub access key (leave empty to use the one saved on this device)</span><input id="imp-key" type="password" autocomplete="off" placeholder=" "></label><div class="row"><button class="btn pri" data-act="ghImport">Copy everything</button></div><p class="note" id="imp-log" aria-live="polite"></p></div>';
ACT.ghImport=async(v,b)=>{
  const log=t=>{$('#imp-log').textContent=t};
  let saved=null;try{saved=JSON.parse(localStorage.getItem('rd-gh')||'null')}catch(e){}
  const token=($('#imp-key').value||'').trim()||(saved&&saved.token),repo=(saved&&saved.repo)||'LillianOu/returns-desk-data';
  if(!token){log('No GitHub key on this device. Paste one above.');return}
  b.disabled=true;
  const api=(p,acc)=>fetch('https://api.github.com/repos/'+repo+'/contents/'+p,{cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:acc||'application/vnd.github.raw+json'}});
  const json=async p=>{const r=await api(p);if(r.status===404)return{};if(!r.ok)throw new Error('GitHub '+r.status+' reading '+p);const t=await r.text();return t.trim()?JSON.parse(t):{}};
  const list=async p=>{const r=await api(p,'application/vnd.github+json');if(r.status===404)return[];if(!r.ok)throw new Error('GitHub '+r.status+' listing '+p);return r.json()};
  const sb=GH.sb,C=GH.me().company_id,ok=r=>{if(r.error)throw new Error(r.error.message);return r.data};
  try{
    log('Reading company settings…');
    const orgs=await json('orgs.json');
    const cur=ok(await sb.from('companies').select('settings').eq('id',C).single()).settings||{};
    ok(await sb.from('companies').update({settings:Object.assign(cur,orgs)}).eq('id',C));
    log('Copying tenants…');
    const clients=await json('clients.json');
    const trows=Object.entries(clients).map(([id,d])=>({company_id:C,legacy_id:id,name:d.name||'',code:d.code||null,email:d.email||null,settings:d}));
    if(trows.length)ok(await sb.from('tenants').upsert(trows,{onConflict:'company_id,legacy_id'}));
    log('Copying SKU lists…');
    let nsku=0;
    for(const f of (await list('skus')).filter(f=>f.name.endsWith('.json'))){
      const cid=f.name.replace(/\.json$/,''),docs=await json('skus/'+f.name);
      const rows=Object.entries(docs).map(([k,d])=>({company_id:C,client_key:cid,doc_key:k,items:(d&&d.items)||{}}));
      rows.forEach(r=>nsku+=Object.keys(r.items).length);
      if(rows.length)ok(await sb.from('sku_docs').upsert(rows,{onConflict:'company_id,client_key,doc_key'}));
    }
    log('Copying returns…');
    const rets=Object.entries(await json('returns.json')),isD=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v);
    for(let i=0;i<rets.length;i+=200){
      const rows=rets.slice(i,i+200).map(([id,d])=>({company_id:C,legacy_id:id,client_key:d.clientId||null,job_no:d.jobNo||null,kind:d.kind==='rts'?'rts':'return',pack:d.pack||null,location:d.location||null,order_no:d.orderNo||null,tracking:d.tracking||null,carrier:d.carrier||null,date_received:isD(d.dateReceived)?d.dateReceived:null,date_processed:isD(d.dateProcessed)?d.dateProcessed:null,status:d.status||'open',notes:d.notes||null,rts:d.rts||null,lines:d.lines||[],history:d.history||[],extra:d,created_at:d.createdAt?new Date(d.createdAt).toISOString():undefined}));
      ok(await sb.from('returns').upsert(rows,{onConflict:'company_id,legacy_id'}));
      log('Copying returns… '+Math.min(i+200,rets.length)+' of '+rets.length);
    }
    const blobs=(await list('blobs')).filter(f=>f.type==='file');let done=0,skipped=0;
    const have=new Set();for(let from=0;;from+=1000){const d=ok(await sb.storage.from('photos').list(C,{limit:1000,offset:from}));d.forEach(x=>have.add(x.name));if(d.length<1000)break}
    for(const f of blobs){
      if(have.has(f.name)){skipped++;continue}
      const r=await api('blobs/'+f.name);if(!r.ok)throw new Error('GitHub '+r.status+' reading photo '+f.name);
      const t=f.name.endsWith('.png')?'image/png':'image/jpeg',blob=new Blob([await r.arrayBuffer()],{type:t});
      ok(await sb.storage.from('photos').upload(C+'/'+f.name,blob,{contentType:t,upsert:true}));
      done++;log('Copying photos… '+(done+skipped)+' of '+blobs.length);
    }
    log('Done: '+trows.length+' tenants, '+nsku+' SKUs, '+rets.length+' returns, '+blobs.length+' photos ('+skipped+' already there). Reload to see them.');
  }catch(e){console.error(e);log('Stopped: '+e.message+'. Nothing is lost; run it again to carry on.')}
  b.disabled=false;

 function add(root){(root||document).querySelectorAll('input[type=password]:not([data-eye])').forEach(i=>{i.dataset.eye='1';const w=document.createElement('span');w.className='pw-wrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
  const b=document.createElement('button');b.type='button';b.className='pw-eye';b.textContent='Show';b.setAttribute('aria-label','Show password');
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Hide':'Show';b.setAttribute('aria-label',show?'Hide password':'Show password');i.focus()});w.appendChild(b)})}
 add();new MutationObserver(()=>add()).observe(document.body,{childList:true,subtree:true});})();

/* live scanner, tuned: QR / Data Matrix / Code 128 for tracking labels, faster frames, continuous focus */
async function liveScan(t){
  SC.target=t;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!(window.ZXing||'BarcodeDetector' in window))return photoScan(t);
  const box=$('#scanner'),v=$('#scanVid'),msg=$('#scanMsg');box.hidden=false;msg.textContent='Starting the camera…';
  try{SC.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})}
  catch(e){console.error(e);msg.textContent=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'The camera is blocked for this site. Allow camera access in the browser settings, or use a photo instead.':'No camera could be started on this device. Use a photo instead.';return}
  if(box.hidden){SC.stream.getTracks().forEach(x=>x.stop());SC.stream=null;return}
  const track=SC.stream.getVideoTracks()[0];
  try{const cap=track.getCapabilities?track.getCapabilities():{},adv={};if(cap.focusMode&&cap.focusMode.includes('continuous'))adv.focusMode='continuous';if(cap.zoom&&cap.zoom.max>=1.5)adv.zoom=Math.min(2,cap.zoom.max);if(Object.keys(adv).length)await track.applyConstraints({advanced:[adv]})}catch(e){}
  v.srcObject=SC.stream;try{await v.play()}catch(e){}
  const isTrack=t==='tracking';
  msg.textContent=isTrack?'Point at the tracking barcode or the square code on the label. Hold 15–20 cm away.':'Point the camera at the barcode or QR code';
  const done=code=>{if(box.hidden)return;stopScan();if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}applyScan(t,code)};
  const want=isTrack?['qr_code','data_matrix','code_128','code_39','pdf417']:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code','data_matrix'];
  if('BarcodeDetector' in window){
    let det;try{const sup=BarcodeDetector.getSupportedFormats?await BarcodeDetector.getSupportedFormats():want;const f=want.filter(x=>sup.includes(x));det=new BarcodeDetector(f.length?{formats:f}:undefined)}catch(e){try{det=new BarcodeDetector()}catch(e2){}}
    if(det){let busy=false;SC.timer=setInterval(async()=>{if(busy||v.readyState<2)return;busy=true;try{const r=await det.detect(v);if(r&&r[0])done(r[0].rawValue)}catch(e){}busy=false},150);return}
  }
  try{const F=ZXing.BarcodeFormat,map={qr_code:F.QR_CODE,data_matrix:F.DATA_MATRIX,code_128:F.CODE_128,code_39:F.CODE_39,pdf417:F.PDF_417,ean_13:F.EAN_13,ean_8:F.EAN_8,upc_a:F.UPC_A,upc_e:F.UPC_E,itf:F.ITF};
    const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,want.map(x=>map[x]).filter(x=>x!==undefined));
    SC.reader=new ZXing.BrowserMultiFormatReader(hints,150);
    SC.reader.decodeFromStream(SC.stream,v,(res)=>{if(res)done(res.getText())})}
  catch(e){console.error(e);msg.textContent='The scanner could not start. Use a photo instead.'}
  setTimeout(()=>{if(!box.hidden&&SC.target===t)msg.textContent='Still looking… move a little further back, add light, or tap "Use a photo instead".'},9000);
}

/* dashboard cards: measure the real text and give all titles one size, all numbers one size, so nothing is cut */
(function(){
  const cv=document.createElement('canvas').getContext('2d');
  const avail=el=>{const c=el.closest('.stg'),cs=getComputedStyle(c);return c.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-4};
  const textW=(el,txt)=>{const cs=getComputedStyle(el);cv.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;const ls=parseFloat(cs.letterSpacing)||0;return cv.measureText(txt).width+ls*txt.length};
  const fitGroup=(els,words)=>{if(!els.length)return;els.forEach(e=>e.style.fontSize='');const base=parseFloat(getComputedStyle(els[0]).fontSize);let k=1;
    els.forEach(e=>{const a=avail(e);const parts=words?(e.textContent||'').trim().split(/\s+/):[(e.textContent||'').trim()];parts.forEach(t=>{const w=textW(e,t);if(w>0)k=Math.min(k,a/w)})});
    if(k<1){const px=Math.floor(base*k*0.97*10)/10+'px';els.forEach(e=>e.style.fontSize=px)}};
  const fit=()=>{fitGroup([...document.querySelectorAll('.stg .stg-t')],true);fitGroup([...document.querySelectorAll('.stg b')],false)};
  let q=0;const later=()=>{cancelAnimationFrame(q);q=requestAnimationFrame(fit)};
  addEventListener('resize',later);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(later);
  const go=()=>{const m=document.getElementById('main');if(!m)return setTimeout(go,300);new MutationObserver(later).observe(m,{childList:true,subtree:true,characterData:true});later()};go()})();

/* =====================================================================
   Camera and photos, 20 Oct 2026 (after hours)
   - Barcode reading uses the phone's own reader where the browser has one
     (Android Chrome), and the modern zxing-cpp reader everywhere else
     (iPhone Safari), instead of the old ZXing JavaScript library.
   - Live camera asks for a sharper stream, reads only the scan box, and offers
     torch and 2x zoom where the phone allows it. The camera stays ready for
     30 seconds after a scan, so scanning several items in a row does not keep
     asking for permission.
   - A label photo now also reads the product barcode and a printed SKU, and
     fills the first empty item line.
   - Item photos are saved at 1280 px on the long side, about 150-250 KB each,
     instead of 1400 px at high quality.
   ===================================================================== */
const BD_URL='https://fastly.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js';
const RETAIL=['ean_13','ean_8','upc_a','upc_e'];
const ALL_FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code','data_matrix','pdf417'];
function loadScriptOnce(src){loadScriptOnce.m=loadScriptOnce.m||{};return loadScriptOnce.m[src]||(loadScriptOnce.m[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>{delete loadScriptOnce.m[src];rej(new Error('load'))};document.head.appendChild(s)}))}
async function detectorClass(){
  if(detectorClass.c)return detectorClass.c;
  if('BarcodeDetector' in window){try{const f=await window.BarcodeDetector.getSupportedFormats();if(f&&f.includes('ean_13'))return detectorClass.c=window.BarcodeDetector}catch(e){}}
  await loadScriptOnce(BD_URL);
  return detectorClass.c=window.BarcodeDetectionAPI.BarcodeDetector;
}
async function makeDetector(formats){
  const C=await detectorClass();let use=formats;
  try{const sup=await C.getSupportedFormats();use=formats.filter(f=>sup.includes(f))}catch(e){}
  return new C(use.length?{formats:use}:undefined);
}
/* every barcode in a picture (canvas, image or video frame), retail product codes first */
async function readCodes(src,formats){
  const det=await makeDetector(formats||ALL_FORMATS);
  const r=await det.detect(src)||[],out=[],seen={};
  r.forEach(x=>{const v=String(x.rawValue||'').replace(/^\][A-Za-z]\d/,'').replace(/[\x00-\x1f]+/g,' ').trim();if(v&&!seen[v]){seen[v]=1;out.push({value:v,format:x.format})}});
  return out.sort((a,b)=>(RETAIL.includes(b.format)?1:0)-(RETAIL.includes(a.format)?1:0));
}
/* photo of a barcode: try a normal size first, then the full photo for tiny barcodes */
async function decode(file){
  try{let r=await readCodes(await fileToImg(file,1600));if(!r.length)r=await readCodes(await fileToImg(file,3000));if(r.length)return r[0].value}catch(e){console.error(e)}
  if(window.ZXing){try{const c=await fileToImg(file,1600),hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);const rd=new ZXing.BrowserMultiFormatReader(hints);const im=new Image();await new Promise((a,b)=>{im.onload=a;im.onerror=b;im.src=c.toDataURL('image/jpeg',.92)});return (await rd.decodeFromImageElement(im)).getText()}catch(e){}}
  return null;
}

/* ---------- item photos: big enough to see clearly, small enough to store ---------- */
const PHOTO_MAX=1280,PHOTO_TARGET=250*1024;
async function smallPhoto(file){
  let c=await fileToImg(file,PHOTO_MAX),q=.72,blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  while(blob&&blob.size>PHOTO_TARGET&&q>.5){q-=.08;blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q))}
  if(blob&&blob.size>PHOTO_TARGET){c=await fileToImg(file,1024);blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.6))}
  return blob;
}
async function onPhotos(files){

}

/* ---------- live camera ---------- */
const SCAN_KEEP_MS=30000;
function scanButtons(track){
  const row=document.querySelector('#scanner .scan-ui .row');if(!row)return;
  row.querySelectorAll('[data-scanx]').forEach(b=>b.remove());
  let cap={};try{cap=track.getCapabilities?track.getCapabilities():{}}catch(e){}
  const add=(label,fn)=>{const b=document.createElement('button');b.type='button';b.className='btn';b.dataset.scanx='1';b.textContent=label;b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();fn(b)});row.insertBefore(b,row.firstChild)};
  if(cap.torch){let on=false;add('Torch',async b=>{on=!on;try{await track.applyConstraints({advanced:[{torch:on}]});b.textContent=on?'Torch off':'Torch'}catch(e){on=!on}})}
  if(cap.zoom&&cap.zoom.max>=2){let z=false;add('Zoom 2×',async b=>{z=!z;try{await track.applyConstraints({advanced:[{zoom:z?Math.min(2,cap.zoom.max):(cap.zoom.min||1)}]});b.textContent=z?'Zoom 1×':'Zoom 2×'}catch(e){z=!z}})}
}
function releaseCamera(){clearTimeout(SC.keep);SC.keep=null;if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}}
function stopScan(){
  clearInterval(SC.timer);SC.timer=null;
  if(SC.reader){try{SC.reader.reset()}catch(e){}SC.reader=null}
  const v=$('#scanVid');if(v){try{v.pause()}catch(e){}v.srcObject=null}
  $('#scanner').hidden=true;
  /* keep the camera ready briefly for the next scan, then let it go */
  clearTimeout(SC.keep);if(SC.stream)SC.keep=setTimeout(releaseCamera,SCAN_KEEP_MS);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&$('#scanner').hidden)releaseCamera()});
const CAM_BLOCKED=/iPhone|iPad|iPod/.test(navigator.userAgent)
  ?'The camera is blocked for this site. Tap aA in the address bar, then Website Settings, then Camera, and choose Allow. Or use a photo instead.'
  :'The camera is blocked for this site. Tap the lock icon next to the address, then Permissions, then Camera, and choose Allow. Or use a photo instead.';
async function liveScan(t){
  SC.target=t;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return photoScan(t);
  const box=$('#scanner'),v=$('#scanVid'),msg=$('#scanMsg');box.hidden=false;msg.textContent='Starting the camera…';
  const isTrack=t==='tracking',formats=isTrack?['qr_code','data_matrix','code_128','code_39','pdf417']:ALL_FORMATS;
  let det=null;const detP=makeDetector(formats).then(d=>det=d).catch(e=>{console.error(e)});
  clearTimeout(SC.keep);SC.keep=null;
  const live=SC.stream&&SC.stream.getVideoTracks().some(x=>x.readyState==='live');
  if(!live){
    try{SC.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})}
    catch(e){console.error(e);msg.textContent=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?CAM_BLOCKED:'No camera could be started on this device. Use a photo instead.';return}
  }
  if(box.hidden){stopScan();return}
  const track=SC.stream.getVideoTracks()[0];
  try{const cap=track.getCapabilities?track.getCapabilities():{},adv={};if(cap.focusMode&&cap.focusMode.includes('continuous'))adv.focusMode='continuous';if(Object.keys(adv).length)await track.applyConstraints({advanced:[adv]})}catch(e){}
  scanButtons(track);
  v.srcObject=SC.stream;try{await v.play()}catch(e){}
